name: ci
on: [push, pull_request]
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-spec
  licence-service:
    # The Cloudflare Worker that issues supporter licence keys. Its tests run on plain Node 24, which strips TypeScript types
    # itself and has WebCrypto Ed25519; `npm ci` installs the Paddle SDK, jose and wrangler from the lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: licence-service
      - run: npm test
        working-directory: licence-service
  android-core:
    # The Kotlin mirror of RackoonCore (android/core) and the sshj transport (android/ssh). Core reads spec/ directly, so every golden
    # fixture is checked here too. The real-server probe (android/probe) is run by hand, never in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :ssh:test :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()   # the parity job reports failing tests too
        with:
          name: junit-android
          path: |
            android/core/build/test-results/test/*.xml
            android/ssh/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: error
  web-core:
    # The Python core of the self-hosted web version (web/backend/rackoon/core) and its asyncssh transport. Core reads spec/
    # directly, so every golden fixture is checked here too; the lab tests skip (no RACKOON_LAB). The second pytest run
    # also runs the scenarios whose feature is not done on web yet, to keep work ahead of the matrix honest; only the
    # first run's report counts for parity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: web/backend
      - run: uv run mypy
        working-directory: web/backend
      - run: uv run pytest --junitxml=build/junit/web.xml
        working-directory: web/backend
      - run: RACKOON_PARITY_ALL=1 uv run pytest -q tests/test_shared_scenarios.py
        working-directory: web/backend
      - uses: actions/upload-artifact@v4
        if: always()   # the parity job reports failing tests too
        with:
          name: junit-web
          path: web/backend/build/junit/*.xml
          retention-days: 7
          if-no-files-found: error
  web-frontend:
    # The self-hosted web version's React + TypeScript UI (web/frontend). It only renders what the backend computes;
    # this checks the types, runs its few formatting tests and builds the bundle the image will serve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web/frontend
      - run: npm run typecheck
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      - run: npx vite build
        working-directory: web/frontend
  web-image:
    # The self-hosted web image (web/Dockerfile): built, smoke-tested the hardened way docs/web.md runs it (read-only root,
    # no capabilities, no new privileges; tools/test-web-image), then the Playwright end-to-end tests (web/e2e) run against
    # it in demo mode, where nothing is sent anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: rackoon-web:test
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python3 tools/test-web-image rackoon-web:test
      - name: Start the image in demo mode
        run: |
          docker run -d --name rk-e2e --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e RACKOON_DEMO=1 -p 127.0.0.1:18090:8080 rackoon-web:test
          for i in $(seq 60); do curl -sf http://127.0.0.1:18090/api/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: web/e2e
      - run: npx playwright test
        working-directory: web/e2e
        env:
          RACKOON_E2E_URL: http://127.0.0.1:18090
      - if: failure()
        run: docker logs rk-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: web/e2e/test-results
          retention-days: 7
  swift-macos:
    # SwiftTerm 1.99 needs Swift 6.2+. On an older toolchain SwiftPM silently picked SwiftTerm 1.20.0, which lacks the
    # APIs the app uses, so CI failed on every push. macos-26 ships Xcode 26 (Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the app's build number is the commit count
      - run: swift --version
      # SwiftPM writes XCTest's xUnit only in parallel mode, and reports a skipped XCTest as passed: the lab tests are left
      # out here so that only the lab job's report can count them (check-parity would otherwise accept a skip).
      - run: swift test --parallel --skip LabIntegrationTests --xunit-output build/junit/swift.xml
        working-directory: apple
      - uses: actions/upload-artifact@v4
        if: always()   # the parity job reports failing tests too
        with:
          name: junit-mac
          path: apple/build/junit/*.xml
          retention-days: 7
          if-no-files-found: error
      - run: swift build --product RackoonMac
        working-directory: apple
      - name: Build the app bundle
        run: |
          # A mac-v1.2.3 tag builds version 1.2.3; any other push builds the default version, named by commit.
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then
            VERSION="${GITHUB_REF_NAME#mac-v}"
            tools/make-app "$VERSION"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            tools/make-app
          fi
          echo "FILE_ID=$VERSION" >> "$GITHUB_ENV"
      - name: Package
        run: |
          cd build
          NAME="Rackoon-${FILE_ID}-macos-arm64.zip"
          ditto -c -k --keepParent Rackoon.app "$NAME"        # keeps the signature and symlinks intact (plain zip does not)
          shasum -a 256 "$NAME" > "$NAME.sha256"
          ls -l "$NAME" "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Rackoon-macOS-arm64
          path: |
            build/Rackoon-*-macos-arm64.zip
            build/Rackoon-*-macos-arm64.zip.sha256
          retention-days: 14
          if-no-files-found: error

  # The iOS app (apple/Apps/RackoonIOS) on the simulator. The workspace holds the app project and the Swift package, so its
  # test plan runs the app's tests and the shared package tests that build for iOS (RackoonCore, RackoonSSHEmbedded,
  # RackoonDemo) on iOS itself. The result bundle becomes junit-ios for the parity job.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items()) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')"
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: Build and test on the simulator
        working-directory: apple/Apps/RackoonIOS
        run: |
          # -skipPackagePluginValidation: SwiftTerm (a package dependency) has a build-tool plugin xcodebuild would
          # otherwise refuse to run without someone trusting it in Xcode.
          xcodebuild test -workspace RackoonIOS.xcworkspace -scheme RackoonIOS -destination "id=$SIMULATOR" \
            -resultBundlePath "$GITHUB_WORKSPACE/apple/build/ios.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: Convert the results to JUnit
        if: always()
        run: |
          mkdir -p apple/build/junit-ios
          tools/xcresult-junit apple/build/ios.xcresult apple/build/junit-ios/ios.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ios
          path: apple/build/junit-ios/*.xml
          retention-days: 7
          if-no-files-found: error

  # Integration lab (test/lab, docs/parity.md): a throwaway Ubuntu server with Docker in containers on this runner, and
  # every transport's LabIntegrationTests against it. macOS runners have no Docker, so the Mac's OpenSSHTransport runs
  # here on Linux (same code, built in the swift:6.2 image with the repo mounted at the same path).
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: tools/lab up
      - name: Android (sshj) lab checks
        run: |
          # An assignment fails the step if `tools/lab env` fails; a bare eval "$(...)" would carry on with no lab
          # settings and every check would quietly skip itself.
          labenv="$(../tools/lab env)"
          eval "$labenv"
          ./gradlew :ssh:test --tests 'com.bgallagher.rackoon.ssh.LabIntegrationTests'
        working-directory: android
      - name: Mac (OpenSSHTransport, on Linux) lab checks
        run: |
          labenv="$(tools/lab env)"
          eval "$labenv"
          # The container runs as root (it installs ssh), so everything it writes into the checkout (.build, build/) is
          # handed back to the runner's user on exit, pass or fail; root-owned files there broke later steps (EACCES).
          docker run --rm --network host -v "$PWD:$PWD" -w "$PWD/apple" \
            -e RACKOON_LAB -e RACKOON_LAB_HOST -e RACKOON_LAB_PORT -e RACKOON_LAB_USER -e RACKOON_LAB_SUDO_USER \
            -e RACKOON_LAB_SUDO_PASSWORD -e RACKOON_LAB_KEY -e RACKOON_LAB_KNOWN_HOSTS \
            -e OWNER="$(id -u):$(id -g)" \
            swift:6.2 bash -c 'trap "chown -R \"\$OWNER\" .build build 2>/dev/null || true" EXIT
              apt-get update -qq && apt-get install -y -qq openssh-client >/dev/null &&
              swift test --filter RackoonSSHSystemTests.LabIntegrationTests --parallel --xunit-output build/junit-lab/swift.xml'
      # A separate run with fewer workers: both Swift suites at once open more connections than the lab sshd's
      # MaxStartups accepts, and it drops some of them.
      - name: iOS (embedded SwiftNIO SSH transport, on Linux) lab checks
        run: |
          labenv="$(tools/lab env)"
          eval "$labenv"
          # Root in the container, so its output is handed back to the runner's user on exit (as above).
          docker run --rm --network host -v "$PWD:$PWD" -w "$PWD/apple" \
            -e RACKOON_LAB -e RACKOON_LAB_HOST -e RACKOON_LAB_PORT -e RACKOON_LAB_USER -e RACKOON_LAB_SUDO_USER \
            -e RACKOON_LAB_SUDO_PASSWORD -e RACKOON_LAB_KEY -e RACKOON_LAB_KNOWN_HOSTS \
            -e OWNER="$(id -u):$(id -g)" \
            swift:6.2 bash -c 'trap "chown -R \"\$OWNER\" .build build 2>/dev/null || true" EXIT
              swift test --filter RackoonSSHEmbeddedTests.LabIntegrationTests --parallel --num-workers 4 \
                --xunit-output build/junit-ios-lab/swift.xml'
      - uses: astral-sh/setup-uv@v6
      - name: Web (asyncssh) lab checks
        run: |
          labenv="$(../../tools/lab env)"
          eval "$labenv"
          uv sync --locked
          uv run pytest tests/test_lab_integration.py tests/test_api_lab.py tests/test_docker_api_lab.py tests/test_updates_api_lab.py tests/test_w7_api_lab.py --junitxml=build/junit-lab/web.xml
        working-directory: web/backend
      - if: always()
        run: tools/lab down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-android-lab
          path: android/ssh/build/test-results/test/TEST-com.bgallagher.rackoon.ssh.LabIntegrationTests.xml
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-mac-lab
          path: apple/build/junit-lab/*.xml
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ios-lab
          path: apple/build/junit-ios-lab/*.xml
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-web-lab
          path: web/backend/build/junit-lab/*.xml
          retention-days: 7
          if-no-files-found: error

  # Feature parity (docs/parity.md): every test spec/features.json names for a done feature must have run and passed in
  # that platform's JUnit report. Runs even when a test job failed, so the summary names what broke parity.
  parity:
    needs: [spec, swift-macos, android-core, ios, web-core, lab]
    if: always() && needs.spec.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - run: |
          tools/check-parity --summary --require mac,android,ios,web \
            mac=junit/junit-mac,junit/junit-mac-lab android=junit/junit-android,junit/junit-android-lab \
            ios=junit/junit-ios,junit/junit-ios-lab web=junit/junit-web,junit/junit-web-lab | tee parity.txt
          status=${PIPESTATUS[0]}
          { echo '## Feature parity'; echo; cat parity.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # A mac-v* tag publishes the build from this same run as the Mac release. Each platform has its own tag prefix (mac-v*, and
  # android-v* when that app ships), so a release page is about exactly one platform.
  release:
    needs: [spec, swift-macos, android-core]
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rackoon-macOS-arm64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (mac-v0.1.0-alpha.1, mac-v0.2.0-beta.1) is published as a pre-release; plain mac-v1.2.3 is a normal release.
          PRE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rackoon for Mac ${GITHUB_REF_NAME#mac-v}" \
            --generate-notes \
            --notes "**Platform: macOS (Apple silicon, macOS 14 or later).** Developed by Brian Gallagher (https://github.com/bgallagher). It is ad-hoc signed and not notarized, so the first time macOS will say it is from an unidentified developer: right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine Rackoon.app\` once. Verify the download with the .sha256 file."

  # An android-v* tag builds, signs and publishes the Android APK as its own release (the Mac has mac-v*). The signing key comes
  # from repository secrets and exists only on the runner for this job.
  android-release:
    needs: [spec, android-core]
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version code is the commit count, so it only ever goes up
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          export ANDROID_VERSION_NAME="$VERSION"
          export ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          NAME="Rackoon-${VERSION}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/$NAME"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum "$NAME" > "$NAME.sha256" && ls -l
      - name: Check the APK is signed
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose dist/Rackoon-*-android.apk
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          PRE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rackoon for Android ${VERSION}" \
            --generate-notes \
            --notes "**Platform: Android (APK, Android 8.0 or later).** Developed by Brian Gallagher (https://github.com/bgallagher). One universal APK, signed with the Rackoon release key; it is not on Google Play, so open the file on your phone and allow \"Install unknown apps\" for your browser or file manager when Android asks. Updates install over the top as long as they come from this release series. Verify the download with the .sha256 file. Looking for the Mac app? See the releases named \"Rackoon for Mac\"."

  # A web-v* tag publishes the self-hosted web image to GHCR (linux/amd64 and linux/arm64, with an SBOM and build
  # provenance) and a release page "Rackoon for the web <version>". A version with a suffix is a pre-release and does not
  # move the `latest` tag.
  web-release:
    needs: [spec, web-core, web-frontend, web-image]
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and tags
        id: names
        run: |
          VERSION="${GITHUB_REF_NAME#web-v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rackoon-web"
          TAGS="$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: VERSION=${{ steps.names.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.names.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          PRE=""
          if [[ "$VERSION" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rackoon for the web ${VERSION}" \
            --generate-notes \
            --notes "**Platform: self-hosted web (Docker image, linux/amd64 and linux/arm64).** \`docker pull ${IMAGE}:${VERSION}\` (digest \`${DIGEST}\`). Run it on your tailnet, never on the open internet: see docs/web.md for the compose file, HTTPS through Tailscale and the first sign-in. Looking for the apps? See the releases named \"Rackoon for Mac\" and \"Rackoon for Android\"."
